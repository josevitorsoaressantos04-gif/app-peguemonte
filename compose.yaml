services:
  postgres:
    image: postgres:16-alpine
    container_name: peguemonte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: peguemonte_db
      POSTGRES_USER: peguemonte_user
      POSTGRES_PASSWORD: peguemonte_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peguemonte_user -d peguemonte_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
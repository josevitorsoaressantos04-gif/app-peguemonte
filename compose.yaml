services:
  postgres:
    image: postgres:16-alpine
    container_name: peguemonte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: peguemonte_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2025
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peguemonte_user -d peguemonte_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: